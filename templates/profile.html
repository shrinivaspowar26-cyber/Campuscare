<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Settings - Campus Care</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

  <div class="app-layout">
    
    <div id="app-sidebar"></div>

    <div class="app-main">
      
      <div id="app-header"></div>

      <main class="page-content">

        <div style="max-width: 760px; margin: 0 auto;">
          
          <div style="margin-bottom: 24px;">
            <h2 style="font-size: 22px; font-weight: 700; color: var(--primary-navy);">Profile Settings</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-top: 2px;">
              Manage your personal information and contact preferences for maintenance notifications
            </p>
          </div>

          <!-- Profile Information Card -->
          <div class="card">
            
            <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--border-light);">
              <div class="user-avatar-circle" style="width: 56px; height: 56px; font-size: 22px;" id="profile-avatar-circle">
                U
              </div>
              <div>
                <h3 style="font-size: 18px; font-weight: 700; color: var(--primary-navy);" id="profile-display-name">User Name</h3>
                <div class="metadata-line" style="margin-top: 4px;">
                  <span id="profile-role-badge" class="quick-role-badge">Role</span>
                  <span class="metadata-separator">·</span>
                  <span id="profile-id-tag" style="font-family: monospace; font-size: 12px;">ID: ---</span>
                </div>
              </div>
            </div>

            <form id="profile-form">
              
              <div class="form-row">
                <div class="form-group">
                  <label for="prof-name" class="form-label">Full Name <span class="required">*</span></label>
                  <input type="text" id="prof-name" class="form-control" required>
                </div>

                <div class="form-group">
                  <label for="prof-email" class="form-label">University Email</label>
                  <input type="email" id="prof-email" class="form-control" disabled style="background-color: #F8FAFC; color: var(--text-muted);">
                  <div class="form-hint">Email address cannot be changed in portal demo.</div>
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="prof-dept" class="form-label">Department / School <span class="required">*</span></label>
                  <input type="text" id="prof-dept" class="form-control" required>
                </div>

                <div class="form-group">
                  <label for="prof-phone" class="form-label">Contact Phone <span class="required">*</span></label>
                  <input type="tel" id="prof-phone" class="form-control" required>
                </div>
              </div>

              <!-- Notification Preferences -->
              <div class="form-group" style="margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-light);">
                <label class="form-label" style="font-weight: 700; margin-bottom: 6px;">Email Notifications</label>
                <label style="display: flex; align-items: flex-start; gap: 9px; cursor: pointer; font-size: 13px; color: var(--primary-navy);">
                  <input type="checkbox" id="prof-email-notifications" style="margin-top: 2px;">
                  <span>Receive email updates when my problem reports are submitted, assigned to maintenance crews, updated in progress, resolved, or rejected.</span>
                </label>
              </div>

              <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; border-top: 1px solid var(--border-light); padding-top: 16px;">
                <button type="submit" class="btn btn-teal" id="btn-save-profile">
                  Save Changes
                </button>
              </div>

            </form>

          </div>

          <!-- Session & Sign Out -->
          <div class="card" style="border-color: #FECACA; background-color: #FFF5F5;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <h4 style="font-size: 14px; font-weight: 700; color: #991B1B;">Sign Out of Portal</h4>
                <p style="font-size: 12px; color: #7F1D1D; margin-top: 2px;">End your current active session and return to login screen</p>
              </div>
              <button type="button" class="btn btn-danger btn-sm" id="btn-profile-logout">
                Sign Out
              </button>
            </div>
          </div>

        </div>

      </main>

    </div>

  </div>

  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/components.js') }}"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await CampusCareUI.initPage("profile", {
        pageTitle: "Profile & Account Settings"
      });

      const user = await CampusCareAPI.getCurrentUser();
      if (!user) return;

      const initials = user.name.split(" ").map(n => n[0]).join("").substring(0, 2).toUpperCase();
      document.getElementById("profile-avatar-circle").textContent = initials;
      document.getElementById("profile-display-name").textContent = user.name;
      document.getElementById("profile-role-badge").textContent = user.roleLabel || user.role;
      document.getElementById("profile-id-tag").textContent = `ID: ${user.identifier || user.email}`;

      document.getElementById("prof-name").value = user.name;
      document.getElementById("prof-email").value = user.email;
      document.getElementById("prof-dept").value = user.department || "";
      document.getElementById("prof-phone").value = user.phone || "";
      document.getElementById("prof-email-notifications").checked = user.emailNotifications !== false;

      // Save Profile Form
      document.getElementById("profile-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const updated = {
          name: document.getElementById("prof-name").value,
          department: document.getElementById("prof-dept").value,
          phone: document.getElementById("prof-phone").value,
          emailNotifications: document.getElementById("prof-email-notifications").checked
        };

        try {
          await CampusCareAPI.updateProfile(user.id, updated);
          CampusCareUI.toast("Profile updated successfully!", "success");
          setTimeout(() => window.location.reload(), 400);
        } catch (err) {
          CampusCareUI.toast(err.message, "error");
        }
      });

      // Logout handler
      document.getElementById("btn-profile-logout").addEventListener("click", async () => {
        await CampusCareAPI.logout();
        window.location.href = "/login";
      });
    });
  </script>
</body>
</html>
